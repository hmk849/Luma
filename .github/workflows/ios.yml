name: Build Luma iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: macos-26

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify ZIP
        run: |
          set -euo pipefail
          test -f "$GITHUB_WORKSPACE/Luma-Firebase-Ready.zip"

      - name: Extract project
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/unpacked"
          unzip -oq "$GITHUB_WORKSPACE/Luma-Firebase-Ready.zip" \
            -d "$GITHUB_WORKSPACE/unpacked"
          test -f "$GITHUB_WORKSPACE/unpacked/Luma/project.yml"
          test -f "$GITHUB_WORKSPACE/unpacked/Luma/GoogleService-Info.plist"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: unpacked/Luma
        run: xcodegen generate

      - name: Build unsigned iOS app
        working-directory: unpacked/Luma
        run: |
          set -euo pipefail
          xcodebuild \
            -project Luma.xcodeproj \
            -scheme Luma \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$GITHUB_WORKSPACE/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP_PATH="$GITHUB_WORKSPACE/DerivedData/Build/Products/Release-iphoneos/Luma.app"
          test -d "$APP_PATH"

          PACKAGE_DIR="$GITHUB_WORKSPACE/ipa-package"
          mkdir -p "$PACKAGE_DIR/Payload"
          cp -R "$APP_PATH" "$PACKAGE_DIR/Payload/Luma.app"

          cd "$PACKAGE_DIR"
          zip -qr "$GITHUB_WORKSPACE/Luma.ipa" Payload

          test -s "$GITHUB_WORKSPACE/Luma.ipa"
          ls -lh "$GITHUB_WORKSPACE/Luma.ipa"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Luma-unsigned-IPA
          path: ${{ github.workspace }}/Luma.ipa
          if-no-files-found: error
          retention-days: 14
